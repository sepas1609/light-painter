<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Light Painter · Boddu Saran</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Courier New',monospace;cursor:none}
  canvas{display:block}
  #ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
  #ui h1{font-size:1rem;color:#10b981;letter-spacing:3px;text-shadow:0 0 20px #10b981}
  #ui p{font-size:.65rem;color:#2a4a3a;margin-top:3px;letter-spacing:1px}
  #controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:10;flex-wrap:wrap;justify-content:center}
  button{background:rgba(16,185,129,.1);border:1px solid #10b98144;color:#10b981;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:.68rem;letter-spacing:1px;transition:all .3s;font-family:'Courier New',monospace}
  button:hover,button.sel{background:rgba(16,185,129,.3);box-shadow:0 0 12px #10b98166}
  a{color:#00e5ff;text-decoration:none;font-size:.7rem;letter-spacing:2px;border:1px solid #00e5ff33;padding:5px 12px;border-radius:20px;background:rgba(0,229,255,.05)}
  #colorPicker{width:28px;height:28px;border-radius:50%;border:2px solid #10b98155;cursor:pointer;background:none;padding:0;appearance:none;-webkit-appearance:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>💡 LIGHT PAINTER</h1>
  <p>Move cursor to paint with light · trails fade slowly</p>
</div>
<div id="controls">
  <input type="color" id="colorPicker" value="#00ff88" title="Pick color"/>
  <button onclick="setBrush('glow')" class="sel" id="bGlow">✦ Glow</button>
  <button onclick="setBrush('neon')" id="bNeon">⚡ Neon</button>
  <button onclick="setBrush('spark')" id="bSpark">✨ Spark</button>
  <button onclick="setBrush('rainbow')" id="bRainbow">🌈 Rainbow</button>
  <button onclick="clearCanvas()">✕ Clear</button>
  <a href="https://github.com/sepas1609" target="_blank">sepas1609</a>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight;
window.addEventListener('resize',()=>{W=c.width=innerWidth;H=c.height=innerHeight;});

const picker=document.getElementById('colorPicker');
let color='#00ff88',brushType='glow',isDrawing=false,lastX=0,lastY=0;
let rainbowHue=0;

picker.addEventListener('input',e=>{color=e.target.value;});

function setBrush(type){
  brushType=type;
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('sel'));
  document.getElementById('b'+type.charAt(0).toUpperCase()+type.slice(1)).classList.add('sel');
}

function clearCanvas(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,1)';
  ctx.fillRect(0,0,W,H);
}
clearCanvas();

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function paintAt(x,y,px,py){
  const dx=x-px,dy=y-py;
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/2));

  let drawColor=color;
  if(brushType==='rainbow'){
    rainbowHue=(rainbowHue+2)%360;
    drawColor=`hsl(${rainbowHue},100%,60%)`;
  }

  for(let s=0;s<=steps;s++){
    const t=s/steps;
    const cx2=px+dx*t,cy2=py+dy*t;

    ctx.globalCompositeOperation='screen';

    if(brushType==='glow'||brushType==='rainbow'){
      // Soft glow
      const r=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,18);
      r.addColorStop(0,drawColor+'ff');r.addColorStop(0.3,drawColor+'88');r.addColorStop(1,drawColor+'00');
      ctx.fillStyle=r;ctx.beginPath();ctx.arc(cx2,cy2,18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=drawColor+'ff';ctx.beginPath();ctx.arc(cx2,cy2,2,0,Math.PI*2);ctx.fill();
    }

    if(brushType==='neon'){
      // Sharp neon line
      ctx.lineWidth=3;ctx.strokeStyle=drawColor+'ff';
      if(s>0){ctx.beginPath();ctx.moveTo(px+dx*(s-1)/steps,py+dy*(s-1)/steps);ctx.lineTo(cx2,cy2);ctx.stroke();}
      // Outer glow
      ctx.lineWidth=8;ctx.strokeStyle=drawColor+'22';
      if(s>0){ctx.beginPath();ctx.moveTo(px+dx*(s-1)/steps,py+dy*(s-1)/steps);ctx.lineTo(cx2,cy2);ctx.stroke();}
      // Core dot
      ctx.fillStyle=drawColor;ctx.beginPath();ctx.arc(cx2,cy2,2,0,Math.PI*2);ctx.fill();
    }

    if(brushType==='spark'){
      // Random sparks
      for(let i=0;i<4;i++){
        const angle=Math.random()*Math.PI*2;
        const dist=Math.random()*25;
        const sx=cx2+Math.cos(angle)*dist,sy=cy2+Math.sin(angle)*dist;
        const rgb=hexToRgb(drawColor);
        const alpha=Math.random();
        ctx.fillStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
        const r2=0.5+Math.random()*2.5;
        ctx.beginPath();ctx.arc(sx,sy,r2,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle=drawColor;ctx.beginPath();ctx.arc(cx2,cy2,1.5,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
}

// Slow fade each frame
function fade(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.005)';
  ctx.fillRect(0,0,W,H);
}

// Mouse
document.addEventListener('mousedown',e=>{isDrawing=true;lastX=e.clientX;lastY=e.clientY;});
document.addEventListener('mouseup',()=>isDrawing=false);
document.addEventListener('mousemove',e=>{
  if(isDrawing){paintAt(e.clientX,e.clientY,lastX,lastY);lastX=e.clientX;lastY=e.clientY;}
  // Always paint cursor glow
  ctx.globalCompositeOperation='screen';
  const rr=ctx.createRadialGradient(e.clientX,e.clientY,0,e.clientX,e.clientY,8);
  rr.addColorStop(0,(brushType==='rainbow'?`hsl(${rainbowHue},100%,70%)`:color)+'66');
  rr.addColorStop(1,(brushType==='rainbow'?`hsl(${rainbowHue},100%,70%)`:color)+'00');
  ctx.fillStyle=rr;ctx.beginPath();ctx.arc(e.clientX,e.clientY,8,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
});

// Touch
document.addEventListener('touchstart',e=>{e.preventDefault();isDrawing=true;const t=e.touches[0];lastX=t.clientX;lastY=t.clientY;},{passive:false});
document.addEventListener('touchend',()=>isDrawing=false);
document.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];if(isDrawing){paintAt(t.clientX,t.clientY,lastX,lastY);lastX=t.clientX;lastY=t.clientY;}},{passive:false});

// Canvas text hint
ctx.fillStyle='rgba(16,185,129,0.08)';
ctx.font='bold 60px Courier New';
ctx.textAlign='center';
ctx.fillText('paint with light',W/2,H/2);
ctx.font='18px Courier New';
ctx.fillText('move cursor to begin',W/2,H/2+50);

let frame=0;
function loop(){
  frame++;
  if(frame%3===0) fade();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
